name: CI

# The fork's merge gate: an agent-delivered pull request merges when this
# workflow is green (org decision #29, squash per #28). Upstream's publishing
# jobs are deliberately gone — the GHCR push to ghcr.io/ni-c/*, the npm
# release, the docs site, the registry submission, the nightly e2e report,
# the weekly audit run — because this fork is installed from a git checkout
# by Taskhandler and none of those pipelines can authenticate to upstream's
# registries anyway. The quiet weeks the weekly audit used to cover are owned
# by Dependabot (org baseline #7): an advisory on an unchanged tree arrives
# as an update pull request, which runs this workflow.

# A fresh path, not upstream's ci.yml: the old path is disabled in the
# repository's Actions settings, and a disabled workflow does not run even
# for a pull request that rewrites its file. Deleting the old path and
# starting this one leaves nothing to re-enable by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # One LTS major (org Node policy #20 forbids <= 20). The matrix
          # upstream carries tests the same code twice for a package nobody
          # publishes from here.
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      # The e2e and unit trees are type-checked here even though the suites
      # themselves run elsewhere: vitest transpiles without checking, and a
      # dependency bump that removes a type would otherwise surface long
      # after the pull request was green.
      - run: npm run typecheck:e2e
      - run: npm run typecheck:test
      - run: npm test
      # Committed generated output is authoritative and drift-gated (#26):
      # fail on drift rather than letting a hand edit ship.
      - run: npm run assets:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: an audit has no business running install hooks.
      - run: npm ci --ignore-scripts
      # The whole tree, not --omit=dev: the fork runs from source, so what
      # builds it is part of what runs.
      - run: npm audit --audit-level=high
      # The Dockerfiles stay in the fork for local container builds, so the
      # pin discipline around their base images stays checkable.
      - run: .github/scripts/check-base-image-pin.sh Dockerfile Dockerfile.docker-proxy

  # dependency-review: dropped until the repository's dependency graph is
  # enabled in Settings -> Code security (part of org baseline #7); audit
  # above gates known advisories on the tree as it is meanwhile.

  codeql:
    # Org security baseline #7: code scanning on every public repository.
    # The guard rather than an unconditional run: the upload needs GitHub
    # Advanced Security the day this repository is made private, and the
    # guard states that instead of leaving a job that can never pass.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # init and analyze must always move together.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
